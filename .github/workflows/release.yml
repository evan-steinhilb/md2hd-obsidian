name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release metadata
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Verify committed bundle is reproducible
        run: git diff --exit-code -- main.js

      - name: Attest main.js build provenance
        uses: actions/attest@v4
        with:
          subject-path: main.js

      - name: Publish Obsidian release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
